[project]
name = "agenda-signal"
version = "0.1.0"
description = "Track meeting agendas in real time with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk"]

[project.scripts]
agenda-signal = "agenda_signal.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
